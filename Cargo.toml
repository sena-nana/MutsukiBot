[workspace]
members = [
    "crates/mutsuki-runtime-contracts",
    "crates/mutsuki-runtime-core",
    "crates/mutsuki-runtime-host",
    "crates/mutsuki-runtime-sdk",
    "crates/mutsuki-runtime-sdk-macros",
    "crates/mutsuki-runtime-wire",
    "crates/mutsuki-plugin-api",
    "crates/mutsuki-plugin-host",
    "crates/mutsuki-runtime-benchmarks",
    "crates/mutsuki-runtime-host/fixtures/abi-v2-plugin",
    "crates/link/crates/*",
    "hosts/cli",
    "hosts/service/crates/*",
    "hosts/service/fixtures/abi-plugin",
    "hosts/tauri/crates/*",
    "hosts/tauri/fixtures/binary-runner",
    "hosts/web/crates/*",
    "hosts/distributed/crates/*",
    "kits/agent/crates/*",
    "plugins/bot/crates/*",
    "plugins/bot/examples/*",
    "plugins/std/crates/*",
    "plugins/std/plugins/*",
    "plugins/std/protocols/*",
    "products/bot/crates/*",
]
resolver = "2"
exclude = [
    "fuzz",
    "kits/agent/examples/rust-agent-tool",
    "kits/agent/examples/rust-model-provider",
    "kits/agent/templates/rust-agent-tool",
    "kits/agent/templates/rust-model-provider",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/sena-nana/Mutsuki"


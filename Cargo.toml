[workspace.lints.rust]
# `deny` rather than `forbid` so the few FFI and process-boundary crates can carry a
# narrow, greppable `allow(unsafe_code)` with a SAFETY argument. `forbid` cannot be
# overridden at all, which would force those crates to opt out of the workspace lint
# table entirely and take the whole clippy policy with them.
# `check_workspace.py` enforces both the membership of that exception list and the
# requirement that every workspace member inherits this table.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"

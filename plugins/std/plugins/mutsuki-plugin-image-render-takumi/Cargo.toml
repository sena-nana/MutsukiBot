[package]
name = "mutsuki-plugin-image-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
html-escape.workspace = true
image.workspace = true
mutsuki-protocol-image.workspace = true
mutsuki-runtime-contracts.workspace = true
mutsuki-runtime-core.workspace = true
mutsuki-runtime-sdk.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
takumi = { version = "=2.5.7", features = ["from-html"] }
# Takumi 2.5.7 publishes broad subcrate ranges whose latest releases are not mutually compatible.
# Keep the owner package independently resolvable instead of relying on the monorepo lockfile.
takumi-core = "=0.14.0"
takumi-html = "=0.1.20"
takumi-raster = "=0.4.8"
# Feature unification only: takumi-core enables parley without `complex-scripts`, leaving CJK
# text with per-character line breaking plus missing-model warnings in debug builds. This
# selects parley's dictionary segmenter (baked cjdict) for the whole build.
parley = { version = "0.11", default-features = false, features = ["complex-scripts"] }

[dev-dependencies]
mutsuki-plugin-resource-memory = { path = "../mutsuki-plugin-resource-memory" }

[lints]
workspace = true

[package]
name = "mutsuki-bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "mutsuki-bot"
path = "src/main.rs"
required-features = ["web-console"]

[features]
default = ["web-console"]
web-console = ["dep:mutsuki-bot-web-console", "dep:mutsuki-web-host"]

[dependencies]
mutsuki-distributed-contracts.workspace = true
mutsuki-distributed-control-client.workspace = true
mutsuki-service-config.workspace = true
mutsuki-service-runtime.workspace = true
mutsuki-agent-service-host-integration.workspace = true
mutsuki-bot-flow.workspace = true
mutsuki-bot-service-host-integration.workspace = true
mutsuki-bot-web-console = { workspace = true, optional = true }
mutsuki-config-service.workspace = true
mutsuki-plugin-bot-adapter-qqbot.workspace = true
mutsuki-plugin-bot-agent.workspace = true
mutsuki-plugin-bot-bilibili.workspace = true
mutsuki-plugin-bot-bilibili-workshop.workspace = true
mutsuki-plugin-bot-event-router.workspace = true
mutsuki-plugin-bot-flow-agent-tool.workspace = true
mutsuki-plugin-bot-mihuashi.workspace = true
mutsuki-plugin-config-sqlite.workspace = true
mutsuki-plugin-resource-sqlite.workspace = true
mutsuki-std-service-host-integration.workspace = true
mutsuki-service-control.workspace = true
mutsuki-web-host = { workspace = true, optional = true }
thiserror = "2.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
rpassword.workspace = true

[dev-dependencies]
mutsuki-bot-web-console.workspace = true
mutsuki-agent-bundle.workspace = true
mutsuki-agent-contracts.workspace = true
mutsuki-agent-sdk.workspace = true
mutsuki-plugin-agent-model-gateway.workspace = true
mutsuki-runtime-contracts.workspace = true
mutsuki-runtime-sdk.workspace = true
mutsuki-service-ipc.workspace = true
mutsuki-web-protocol.workspace = true
mutsuki-plugin-bot-adapter-qqbot.workspace = true
mutsuki-plugin-bot-command.workspace = true
mutsuki-plugin-bot-control-web.workspace = true
mutsuki-bot-protocol.workspace = true
mutsuki-plugin-bot-event-router.workspace = true
mutsuki-bot-testkit.workspace = true
mutsuki-protocol-browser.workspace = true
mutsuki-runtime-core.workspace = true
mutsuki-service-plugin-loader.workspace = true
reqwest.workspace = true
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true
futures = "0.3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
